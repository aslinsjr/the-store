<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Store</title>
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <!-- Scripts -->
    <script src="script.js" defer></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
    <header>
        <div class="header-table" id="store-name-box">
            <span>Nome da loja</span>
            <span id="store-name"></span>
        </div>
        <div class="header-table" id="total-value-box">
            <span>Patrimônio</span>
            <span id="total-value"></span>
        </div>
        <div class="header-table" id="cashier-value-box">
            <span>Caixa</span>
            <span id="cashier-value"></span>
        </div>
        <div class="header-table" id="cashier-value-box">
            <span>Receita/Despesas</span>
            <span id="cashier-value"></span>
        </div>
        <div class="header-table" id="date-box">
            <span id="day"></span>
            <span id="date"></span>
            <span id="clock"></span>
        </div>
    </header>
    <div id="map"></div>
    <div class="modal">
        <h1>The Store</h1>
        <p>Simulador de empreendedorismo</p>
    </div>
    </div>
</body>

</html>
